<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My CV</title>

    <!-- Font Roboto -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700,900">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- LEFT CONTENT -->

        <aside class="sidebar">

            <div class="profile">

                <div class="profile-name">

                    <span class="name">
                        Henry Rooney
                    </span>

                    <br>

                    <span class="job">
                        Creative Designer
                    </span>

                </div>

                <figure class="profile-image">

                    <img src="training/profile.ba9daec7.jpg" alt="Henry Rooney">

                </figure>

                <ul class="profile-information">

                    <li class="profile-icon">

                        <img src="training/glasses.3e8381e1.png" alt="">

                    </li>

                    <li>
                        <p>
                            <span>Name:</span>
                            Chris Johnson
                        </p>
                    </li>

                    <li>
                        <p>
                            <span>Birthday:</span>
                            06 December 1987
                        </p>
                    </li>

                    <li>
                        <p>
                            <span>Job:</span>
                            Freelancer
                        </p>
                    </li>

                    <li>
                        <p>
                            <span>Email:</span>
                            henry@domain.com
                        </p>
                    </li>

                    <li>
                        <p>
                            <span>Skype:</span>
                            henryrooney85
                        </p>
                    </li>

                </ul>

                <!-- Nút Download CV -->
                <button class="download-btn" type="button">

                    Download Cv

                    <span class="download-icon">
                        <i class="fa-solid fa-download" aria-hidden="true"></i>
                    </span>

                </button>

            </div>

        </aside>

        <!-- RIGHT CONTENT -->

        <main class="main-content">

            <header class="header">

                <nav>
                    Menu
                </nav>

            </header>

            <section class="content">
                Content
            </section>

            <footer class="footer">
                Footer
            </footer>

        </main>

    </div>

</body>

</html>
